[package]
name = "verfy-verify"
version = "0.29.0"
edition = "2021"
rust-version = "1.70"
description = "Check Verfy receipts and ledgers (verfy.receipt/1): canonical JSON, Ed25519 signatures, the hash chain"
license = "MIT"
repository = "https://github.com/verfy-dev/verfy"
homepage = "https://verfy.dev"
keywords = ["verfy", "receipts", "ed25519", "audit", "ai-agents"]
categories = ["cryptography"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde_json = "1"
sha2 = "0.10"
